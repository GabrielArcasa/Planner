<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181A">
  <title>Organizador</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316181A'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23fff' stroke='%23FFD100' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#calendario"><span class="brand-stop" aria-hidden="true"></span>Organizador</a>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button class="tab" role="tab" id="tab-calendario" data-view="calendario" aria-controls="view-calendario"></button>
      <button class="tab" role="tab" id="tab-planner" data-view="planner" aria-controls="view-planner"></button>
      <button class="tab" role="tab" id="tab-kanban" data-view="kanban" aria-controls="view-kanban"></button>
    </nav>
    <ul class="legend" aria-label="Linhas (categorias)"></ul>
  </header>

  <main>
    <section class="view view-cal" id="view-calendario" role="tabpanel" aria-labelledby="tab-calendario" hidden></section>
    <section class="view view-planner" id="view-planner" role="tabpanel" aria-labelledby="tab-planner" hidden></section>
    <section class="view view-kanban" id="view-kanban" role="tabpanel" aria-labelledby="tab-kanban" hidden></section>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/composer.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
